<div class="hero-image">
  <div style="position: relative; max-width: 320px; margin: 0 auto">
    <!-- Optional device frame -->
    <div
      style="
        position: relative;
        background: #000;
        border-radius: 36px;
        padding: 12px;
        box-shadow: 0 30px 50px rgba(0, 0, 0, 0.2);
      "
    >
      <!-- Screen notch/speaker -->
      <div
        style="
          position: absolute;
          top: 8px;
          left: 50%;
          transform: translateX(-50%);
          width: 120px;
          height: 24px;
          background: #111;
          border-radius: 20px;
          z-index: 2;
        "
      ></div>

      <video
        autoplay
        muted
        loop
        playsinline
        style="width: 100%; border-radius: 28px; display: block"
      >
        <source src="app-screen-recording.mp4" type="video/mp4" />
      </video>

      <!-- Home indicator -->
      <div
        style="
          position: absolute;
          bottom: 8px;
          left: 50%;
          transform: translateX(-50%);
          width: 130px;
          height: 4px;
          background: rgba(255, 255, 255, 0.3);
          border-radius: 2px;
        "
      ></div>
    </div>
  </div>
</div>
